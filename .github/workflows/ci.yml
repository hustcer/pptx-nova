name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_deckkit_examples:
        description: Skip the slow committed DeckKit examples sync check
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout pptx-nova
        uses: actions/checkout@v7

      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '*'

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run repository checks
        shell: nu {0}
        run: nu tools/ci-check.nu

      - name: Run tool tests
        run: node --test tools/tests/*.test.mjs

      - name: Check theme catalog outputs
        shell: nu {0}
        run: nu tools/generate-pptx-theme-catalog.nu --check --skip-moonbit

      - name: Check theme contrast
        run: node tools/check-pptx-theme-contrast.mjs

      - name: Check committed DeckKit examples
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_deckkit_examples && matrix.os == 'ubuntu-latest' }}
        run: node tools/update-pptx-nova-deckkit-examples.mjs --check --json
